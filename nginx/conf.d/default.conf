# 1. VirtualHost: portal.empresa.local (Servidor estático directo)
server {
    listen 80;
    server_name portal.empresa.local;

    server_tokens off; # Hardening OWASP: oculta la versión del servidor
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/portal_access.log;
    error_log  /var/log/nginx/portal_error.log warn;
}

# 2. VirtualHost: app-gestion.empresa.local (Proxy Inverso hacia Apache)
server {
    listen 80;
    server_name app-gestion.empresa.local;

    server_tokens off;

    location / {
        proxy_pass http://srv-apache-app:80;

        # Preservación de la IP del cliente (Obligatorio RGPD / LOPDGDD)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/app_gestion_access.log;
    error_log  /var/log/nginx/app_gestion_error.log warn;
}